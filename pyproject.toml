[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "puzzlepath"
version = "0.1.0"
description = "Position-only chess puzzle difficulty experiments and printable practice sets."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-or-later"
dependencies = [
  "chess>=1.11.2,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "scikit-learn>=1.6,<2",
  "threadpoolctl>=3.5,<4",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
puzzlepath = "puzzlepath.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzlepath"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
